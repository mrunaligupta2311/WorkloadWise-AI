services:
  - type: web
    name: workloadwise-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run db:generate
    startCommand: npm --workspace backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
